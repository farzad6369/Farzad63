<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>گنجینه جهانی - World Treasure</title>
<style>
:root{--bg:#080d1d;--panel:rgba(18,29,56,.9);--gold:#ffd166;--text:#f8f9fa;--muted:#a9b4cf;--danger:#ef476f;--green:#06d6a0;--red:#c52035;--darkred:#4a0b15}
*{box-sizing:border-box;font-family:Tahoma,sans-serif}
body{margin:0;background:radial-gradient(circle at top,#203a72,#080d1d 70%);color:var(--text);height:100vh;overflow:hidden;transition:background 0.5s}
body.final-phase{background:radial-gradient(circle at top,var(--red),var(--darkred) 80%)}
#app{max-width:480px;height:100vh;margin:auto;position:relative;display:flex;flex-direction:column}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(255,209,102,.3);z-index:10}
.badge{background:#7d1934;padding:6px 12px;border-radius:20px;font-size:14px;font-weight:bold;display:flex;align-items:center;gap:5px}
.screen{position:absolute;inset:60px 0 0;padding:20px;display:none;overflow-y:auto;z-index:5}
.screen.active{display:flex;flex-direction:column}
.panel,.card{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:15px;padding:15px;margin-bottom:12px}
h1{color:var(--gold);text-align:center;margin:10px 0}
button{border:0;border-radius:12px;padding:14px;font-weight:bold;cursor:pointer;transition:0.2s;margin:5px 0}
.btn-main{background:linear-gradient(135deg,#ffd166,#e08e20);color:#241400}
.btn-sub{background:rgba(255,255,255,.1);color:white;border:1px solid rgba(255,209,102,0.4)}
.wallet-box{background:#000;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;word-break:break-all;color:var(--gold);text-align:center;margin:10px 0;border:1px dashed var(--gold)}
.progress-bar{height:8px;background:#1e293b;border-radius:4px;margin:10px 0;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);width:0%;transition:0.5s}
canvas{width:100%;height:100%;display:block;background:#050916}
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;font-size:20px;text-shadow:2px 2px 4px #000;pointer-events:none}
/* Golden Pack Animation */
.gold-pack{border:2px solid var(--gold);background:linear-gradient(145deg,#4a0b15,#8d1326);animation:glow 1.5s infinite alternate;text-align:center}
@keyframes glow{from{box-shadow:0 0 10px var(--gold)}to{box-shadow:0 0 25px var(--gold)}}
.final-timer{color:var(--gold);font-weight:bold;font-size:18px;text-align:center;background:rgba(0,0,0,0.5);padding:10px;border-radius:10px;margin-bottom:10px}
</style>
</head>
<body id="main-body">
<div id="app">
    <header>
        <div style="font-weight:bold;color:var(--gold)">🏺 WORLD TREASURE</div>
        <div class="badge">❤️ <span id="top-lives">5</span></div>
    </header>

    <section id="scr-home" class="screen active">

            <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        </div>
        <button class="btn-main" onclick="startQuest()">🧭 شروع کاوش</button>
        <button class="btn-sub" onclick="openScr('scr-shop')">🛒 بازارچه</button>
        <button class="btn-sub" onclick="openScr('scr-comp')">🏆 مسابقات هفتگی</button>
    </section>

            <div class="card" onclick="goPay('10 USDT','100 Lives')">❤️ ۱۰۰ جان (۱۰ تتر)</div>
