<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>شاهنشاهی بازار ایران</title>
  <style>
    :root {
      --bg: #0a0e17;
      --card: #131b2a;
      --card-inner: #0b111c;
      --border: #233148;
      --gold: #ffb703;
      --gold-dark: #b8860b;
      --green: #06d6a0;
      --red: #ef476f;
      --cyan: #118ab2;
      --text: #f8f9fa;
      --muted: #8d99ae;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: var(--bg);
      color: var(--text);
      padding: 10px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 30px;
    }
    .header-box {
      background: linear-gradient(180deg, #1b263b 0%, #0d1b2a 100%);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(255, 183, 3, 0.15);
    }
    .header-box h1 {
      font-size: 19px;
      color: var(--gold);
      margin-bottom: 6px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
    }
    .stat-item {
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px;
      text-align: center;
    }
    .stat-lbl { font-size: 10px; color: var(--muted); }
    .stat-val { font-size: 14px; font-weight: bold; margin-top: 2px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .card-head {
      font-size: 13px;
      font-weight: bold;
      color: var(--gold);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    select, input {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
      outline: none;
    }
    select:focus, input:focus  border-color: var(--gold); }
    .btn {
      width: 100%;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    .btn-green { background: var(--green); color: #000; }
    .btn-red { background: var(--red); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
    .btn-tether { background: #26a17b; color: #fff; }

    .live-feed {
      height: 65px;
      overflow-y: hidden;
      background: var(--card-inner);
      border-radius: 6px;
      padding: 6px;
      font-size: 11px;
      color: var(--muted);
      border-right: 3px solid var(--green);
    }
    .market-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .badge {
      background: rgba(255, 183, 3, 0.15);
      color: var(--gold);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      border: 1px solid var(--gold);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      z-index: 1000;
      display: none;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">

  <!-- هدر اصلی و وضعیت خزانه -->
  <div class="header-box">
    <h1>⚔️ شاهنشاهی بازار ایران ⚔️</h1>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-lbl">💰 سکه و امتیاز</div>
        <div class="stat-val" id="pointsVal" style="color:var(--gold);">۱,۰۰۰</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">🍞 آذوقه مایحتاج</div>
        <div class="stat-val" id="suppliesVal" style="color:var(--green);">۱۰۰٪</div>
      </div>
      <div class="stat-item">
        <div class="stat-lbl">🛡️ قبیله</div>
        <div class="stat-val" id="clanVal" style="color:var(--cyan); font-size:11px;">بی‌قبیله</div>
      </div>
    </div>
  </div>

  <!-- بخش ورود و ارسال کد تأیید ایمیل -->
  <div class="card" id="authCard">
    <div class="card-head">🔐
