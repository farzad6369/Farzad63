<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پادشاهی بازار ایران</title>
    <style>
        :root { --gold: #d4af37; --dark-bg: #0a0c12; --panel-bg: rgba(10, 12, 18, 0.9); }
        * { box-sizing: border-box; font-family: 'Tahoma', sans-serif; }
        body { margin: 0; background-color: var(--dark-bg); background-image: url('image_gen_f7cd82a7-ac0a-4ea6-a662-87a878828b52_0.png'); background-size: cover; background-position: center; background-attachment: fixed; color: #fff; min-height: 100vh; }
        .overlay { background: rgba(0,0,0,0.6); min-height: 100vh; padding: 15px; }
        
        /* Modal System */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; }
        .modal-content { background: var(--panel-bg); border: 1px solid var(--gold); border-radius: 20px; padding: 20px; margin-top: 50px; color: #fff; position: relative; }
        .close-btn { color: var(--gold); float: left; font-size: 28px; cursor: pointer; }

        .header { display: flex; justify-content: space-between; padding: 10px; background: var(--panel-bg); border: 1px solid var(--gold); border-radius: 12px; margin-bottom: 20px; }
        .stat { color: var(--gold); font-weight: bold; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { background: var(--panel-bg); border: 1px solid var(--gold); border-radius: 15px; padding: 20px; text-align: center; cursor: pointer; }
        .card:active { transform: scale(0.95); }
        .card h3 { color: #f5df9b; margin: 0; font-size: 16px; }
    </style>
</head>
<body>
    <div class="overlay">
        <div class="header">
            <div class="stat">سکه: 12,500</div>
            <div class="stat">جان: 5/5</div>
        </div>

        <div class="dashboard">
            <!-- اضافه کردن رویداد کلیک -->
            <div class="card" onclick="openModal('market')"><h3>بازارچه</h3></div>
            <div class="card" onclick="openModal('battle')"><h3>نبرد</h3></div>
            <div class="card"><h3>گروه‌ها</h3></div>
            <div class="card"><h3>فروشگاه</h3></div>
        </div>
    </div>

    <!-- ساختار پنجره بازشو -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle" style="color:var(--gold)">عنوان</h2>
            <div id="modalBody">محتوای بازی اینجا قرار می‌گیرد.</div>
        </div>
    </div>

    <script>
        function openModal(type) {
            const modal = document.getElementById('gameModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            modal.style.display = 'block';
            
            if(type === 'market') {
                title.innerText = "بازارچه فعال";
                body.innerHTML = "<p>کاروان‌ها در حال تخلیه بار هستند...</p><button onclick='alert(\"خرید انجام شد\")'>خرید نان (50 سکه)</button>";
            } else if(type === 'battle') {
                title.innerText = "نبرد تاریخی";
                body.innerHTML = "<p>سربازان آماده‌اند!</p><button onclick='alert(\"نبرد شروع شد!\")'>حمله به قلعه</button>";
            }
        }

        function closeModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
    </script>
</body>
</html>
