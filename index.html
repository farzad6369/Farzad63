<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پادشاهی بازار ایران</title>
    <style>
        :root { --gold: #d4af37; --dark: #121212; --panel: #1e1e1e; }
        body { margin: 0; background: var(--dark); color: white; font-family: Tahoma, sans-serif; overflow-x: hidden; }
        
        /* Layout */
        .container { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        
        /* Hero Section */
        .hero-box { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://via.placeholder.com/400x200'); /* جایگزین با عکس اصلی */
            background-size: cover; border: 1px solid var(--gold); padding: 20px; text-align: center; border-radius: 10px;
        }
        
        /* Panels */
        .panel { background: var(--panel); border: 1px solid #333; padding: 15px; border-radius: 10px; }
        button { background: var(--gold); border: none; padding: 10px 20px; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 5px; width: 100%; }
        
        /* Timer Style */
        .timer { color: var(--gold); font-size: 1.2em; font-weight: bold; margin: 10px 0; }

        /* Dynasty Scroll */
        .scroll-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .dynasty-card { min-width: 120px; height: 150px; background: #333; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div>کاربر: پادشاه</div>
        <div>سکه: <span id="coins">۴۲۰</span></div>
    </div>

    <!-- Main Cinematic Section -->
    <div class="hero-box">
        <h1>پادشاهی بازار ایران</h1>
        <p>سفر تو، تاریخ را می‌سازد</p>
        <button onclick="enterMarket()">ورود به بازار</button>
        <button onclick="startBattle()" style="background:#8b0000; color:white;">میدان جنگ (۷۲ ساعته)</button>
    </div>

    <!-- Battle & Missions -->
    <div class="panel">
        <h3>میدان نبرد و رتبه‌بندی</h3>
        <div class="timer" id="battleTimer">زمان باقی‌مانده: ۷۲:۰۰:۰۰</div>
        <div id="leaderboard">۱. نام شما (امتیاز: ۸۵۰) - در حال نبرد...</div>
    </div>

    <div class="panel">
        <h3>مأموریت‌های نامحدود</h3>
        <p id="missionText">تلاش برای فتح بازار...</p>
        <button onclick="generateMission()">دریافت مأموریت جدید</button>
    </div>

    <!-- Dynasties -->
    <div class="scroll-container">
        <div class="dynasty-card">مادها</div>
        <div class="dynasty-card">هخامنشیان</div>
        <div class="dynasty-card">اشکانیان</div>
        <div class="dynasty-card">ساسانیان</div>
    </div>
</div>

<script>
    // Battle Timer (72 hours)
    let time = 72 * 60 * 60;
    setInterval(() => {
        time--;
        let h = Math.floor(time / 3600);
        let m = Math.floor((time % 3600) / 60);
        let s = time % 60;
        document.getElementById('battleTimer').innerText = `زمان باقی‌مانده: ${h}:${m}:${s}`;
    }, 1000);

    // Infinite Missions
    function generateMission() {
        const missions = ["فتح راه ابریشم", "تجارت فیل جنگی", "ساخت ارابه داس‌دار", "مذاکره با ساتراپ‌ها"];
        document.getElementById('missionText').innerText = missions[Math.floor(Math.random() * missions.length)];
    }

    // Logic Placeholder
    function enterMarket() { alert("در حال ورود به بازار..."); }
    function startBattle() { alert("شما وارد میدان جنگ شدید. نبرد تا ۷۲ ساعت ادامه دارد."); }
</script>

</body>
</html>
