<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پادشاهی بازار ایران</title>
    <!-- کتابخانه EmailJS برای ارسال ایمیل -->
    <script type="text/javascript" src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // در اینجا کلید عمومی خود را از سایت EmailJS جایگزین کنید
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
    <style>
        :root { --gold: #d4af37; --dark: #121212; --panel: #1e1e1e; }
        body { margin: 0; background: var(--dark); color: white; font-family: Tahoma, sans-serif; overflow-x: hidden; padding-bottom: 20px; }
        .container { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }
        .hero-box { background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), #000; border: 1px solid var(--gold); padding: 20px; text-align: center; border-radius: 10px; }
        .panel { background: var(--panel); border: 1px solid #333; padding: 15px; border-radius: 10px; margin-top: 10px; }
        button { background: var(--gold); border: none; padding: 12px; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; width: 100%; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: #333; border: 1px solid var(--gold); color: white; border-radius: 5px; box-sizing: border-box; }
        .timer { color: var(--gold); font-size: 1.2em; font-weight: bold; margin: 10px 0; text-align: center; }
        .scroll-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; }
        .dynasty-card { min-width: 100px; height: 120px; background: #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold); }
    </style>
</head>
<body>

<div class="container">
    <!-- هدر -->
    <div class="header">
        <div>پادشاه: بازیکن ۹۷</div>
        <div>سکه: ۴۲۰</div>
    </div>

    <!-- بخش قهرمان -->
    <div class="hero-box">
        <h1>پادشاهی بازار ایران</h1>
        <p>سفر تو، تاریخ را می‌سازد</p>
    </div>

    <!-- پنل احراز هویت (OTP) -->
    <div class="panel">
        <h3>ورود به پادشاهی</h3>
        <input type="email" id="userEmail" placeholder="ایمیل خود را وارد کنید">
        <button onclick="sendOTP()">ارسال کد تأیید</button>
    </div>

    <!-- میدان جنگ -->
    <div class="panel">
        <h3>میدان نبرد (۷۲ ساعته)</h3>
        <div class="timer" id="battleTimer">زمان: ۷۲:۰۰:۰۰</div>
        <button style="background:#8b0000; color:white;" onclick="startBattle()">شروع نبرد</button>
    </div>

    <!-- مأموریت‌ها -->
    <div class="panel">
        <h3>مأموریت‌های نامحدود</h3>
        <p id="missionText">تلاش برای فتح بازار...</p>
        <button onclick="generateMission()">دریافت مأموریت جدید</button>
    </div>

    <!-- لیست سلسله‌ها -->
    <div class="scroll-container">
        <div class="dynasty-card">مادها</div>
        <div class="dynasty-card">هخامنشیان</div>
        <div class="dynasty-card">اشکانیان</div>
        <div class="dynasty-card">ساسانیان</div>
    </div>
</div>

<script>
    // سیستم تایمر ۷۲ ساعته
    let time = 72 * 60 * 60;
    setInterval(() => {
        time--;
        let h = Math.floor(time / 3600);
        let m = Math.floor((time % 3600) / 60);
        let s = time % 60;
        document.getElementById('battleTimer').innerText = `زمان باقی‌مانده: ${h}:${m}:${s}`;
    }, 1000);

    // تولید مأموریت تصادفی
    function generateMission() {
        const missions = ["فتح راه ابریشم", "تجارت فیل جنگی", "ساخت ارابه داس‌دار", "مذاکره با ساتراپ‌ها", "گشت‌زنی در بازار"];
        document.getElementById('missionText').innerText = missions[Math.floor(Math.random() * missions.length)];
    }

    // تابع ارسال ایمیل (OTP)
    function sendOTP() {
        const email = document.getElementById("userEmail").value;
        if (!email) { alert("لطفاً ایمیل را وارد کنید"); return; }
        
        const generatedCode = Math.floor(1000 + Math.random() * 9000);
        
        const templateParams = {
            to_email: email,
            message: "کد ورود شما: " + generatedCode
        };

        // جایگزین کنید با IDهای خودتان
        emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams)
            .then(function(response) {
                alert("کد تأیید به ایمیل ارسال شد!");
            }, function(error) {
                alert("خطا در ارسال: " + JSON.stringify(error));
            });
    }

    function startBattle() { alert("شما وارد میدان جنگ شدید."); }
</script>

</body>
</html>
